# Lefthook configuration for Cherry-Sync.
#
# Activate once per clone:   lefthook install
# Test a hook manually:      lefthook run commit-msg --files <path-to-msg-file>

commit-msg:
  commands:
    conventional-commits:
      # {1} is lefthook's placeholder for the commit-msg file path.
      run: |
        subject=$(grep -vE '^(#|$)' {1} | head -n1)
        pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'

        if [[ "$subject" =~ $pattern ]]; then
          exit 0
        fi

        cat >&2 <<EOF

        COMMIT REJECTED — message does not follow Conventional Commits.

        Your subject:
          $subject

        Expected format:
          <type>(<optional-scope>)!?: <description>

        Allowed types:
          feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert

        Examples:
          feat: add diff parser
          fix(cli): handle empty argv without panic
          docs!: drop legacy --pull flag (breaking change)

        See https://www.conventionalcommits.org/

        EOF
        exit 1

pre-push:
  commands:
    go-vet:
      run: go vet ./...
