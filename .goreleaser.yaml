# GoReleaser configuration: https://goreleaser.com
#
# Validate this file with `goreleaser check`; dry-run a build locally with
# `goreleaser release --snapshot --clean`.
version: 2

project_name: cherry-sync

before:
  hooks:
    # Read-only; ensures modules are present before the build.
    - go mod download

builds:
  - id: csync
    main: ./cmd/csync
    binary: csync
    # csync shells out to rsync/ssh and uses no cgo, so a static cross-build is
    # trivial across every target below.
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    # Strip debug info and stamp the release version into main.version, which the
    # --version flag and the interactive banner render. {{ .Version }} is the tag
    # with its leading "v" removed (v1.4.0 -> 1.4.0), so the version line reads
    # "cherry-sync v1.4.0". An un-injected build keeps main.version's "dev" default.
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}

# Sign and notarize the macOS binaries so Gatekeeper lets a downloaded csync run
# without the user clearing a quarantine flag by hand. GoReleaser embeds
# anchore/quill, so this needs no Xcode, no `codesign`, and no macOS runner.
# Runs between build and archive, so the uploaded asset and its checksums.txt
# entry both describe the signed binary.
#
# `enabled` is keyed off a secret rather than hardcoded true, so a run without
# these set (a local snapshot, a fork) builds unsigned instead of failing. The
# two file-shaped inputs are base64 of the .p12 and .p8; the rest are plain
# identifiers. RELEASE-GATE.md covers why notarization is gated here, at build
# time, rather than asserted after publish.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - csync
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        # Block until Apple returns a verdict: a release must not be promoted
        # while notarization is still pending. 20m is the service's own cap.
        wait: true
        timeout: 20m

archives:
  - id: csync
    # Publish the bare executable rather than a tar.gz: csync is a single file
    # carrying its own MIT notice (`csync --license`), so an archive would only
    # add a step the user has to undo.
    formats: [binary]
    # With `binary` this names the uploaded release asset, not the file in dist/
    # (which stays `csync`), so a download is self-identifying:
    # cherry-sync_1.2.3_darwin_arm64.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# CHANGELOG.md is maintained by hand (Keep a Changelog), so suppress
# GoReleaser's git-log-based changelog.
changelog:
  disable: true

release:
  github:
    owner: dpassarelli
    name: cherry-sync
  # Publish as a draft so the release is invisible to users until the release
  # gate passes. A failed gate leaves the draft unpublished for inspection.
  # See RELEASE-GATE.md.
  draft: true
