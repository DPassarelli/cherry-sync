# GoReleaser configuration — https://goreleaser.com
#
# Triggered by a pushed `v*` tag via .github/workflows/release.yml. Builds the
# cross-platform binaries and publishes a GitHub Release with those binaries and
# checksums. Run `goreleaser check` to validate this file and
# `goreleaser release --snapshot --clean` to dry-run a build locally.
version: 2

project_name: cherry-sync

before:
  hooks:
    # Read-only; ensures modules are present before the build.
    - go mod download

builds:
  - id: csync
    main: ./cmd/csync
    binary: csync
    # csync shells out to rsync/ssh and uses no cgo, so a static cross-build is
    # trivial across every target below.
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    # Strip debug info and stamp the release version into main.version, which the
    # --version flag and the interactive banner render. {{ .Version }} is the tag
    # with its leading "v" removed (v1.4.0 -> 1.4.0), so the version line reads
    # "cherry-sync v1.4.0". An un-injected build keeps main.version's "dev" default.
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}

archives:
  - id: csync
    # Publish the bare executable rather than a tar.gz. csync carries its own MIT
    # notice (`csync --license`) and its docs live on GitHub, so an archive would
    # wrap a single file in a step the user has to undo. Downloading a raw binary
    # is one `chmod +x` from a working tool.
    formats: [binary]
    # With `binary` this names the uploaded release asset, not a file in dist/
    # (the binary on disk stays `csync`). The name embeds the version and target
    # so a download is self-identifying: cherry-sync_1.2.3_darwin_arm64.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# CHANGELOG.md is maintained by hand (Keep a Changelog), so suppress
# GoReleaser's git-log-based changelog. Release notes are supplied from the
# extracted CHANGELOG section via --release-notes in the workflow.
changelog:
  disable: true

release:
  github:
    owner: dpassarelli
    name: cherry-sync
  # Publish as a draft so the release is invisible to users until the
  # pre-publish smoketests pass. .github/workflows/release.yml flips it live
  # with `gh release edit --draft=false` only after every smoketest leg is green; a
  # failed smoketest run leaves the draft unpublished for inspection.
  draft: true
