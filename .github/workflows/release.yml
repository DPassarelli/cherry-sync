name: release

on:
  push:
    tags:
      - 'v*'

# build uploads assets, the gate jobs download them from the draft, and promote
# flips the release live. contents: write covers all three.
permissions:
  contents: write

jobs:
  # Build every artifact and publish the GitHub Release as a DRAFT, invisible to
  # users. Release notes and the pre-release flag are set here, on the draft.
  # Only promote reveals it, and only after every gate job passes.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history + tags so GoReleaser can resolve the version.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The release body is the curated CHANGELOG.md section for this tag, not
      # an autogenerated git-log dump.
      - name: Extract release notes from CHANGELOG
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## / { flag=0 }
            flag && /^\[/  { flag=0 }
            flag { print }
          ' CHANGELOG.md > .release-notes.md
          echo "----- release notes for ${ver} -----"
          cat .release-notes.md
          test -s .release-notes.md || { echo "no CHANGELOG section for ${ver}"; exit 1; }

      # Creates a DRAFT release with assets attached (release.draft: true).
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --release-notes=.release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Consumed by the notarize block in .goreleaser.yaml, where
          # MACOS_SIGN_P12 doubles as the on/off switch, so a fork or a
          # secretless run builds unsigned rather than failing.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

      # Re-assert the body from the same .release-notes.md goreleaser was given.
      # Goreleaser's own --release-notes is not the final word: the v0.1.0 run
      # published the commit message instead, so this makes the outcome
      # deterministic. Operates on the draft; it does not reveal the release.
      #
      # Also pins the pre-release flag off the version, so it needs no attention
      # when the project crosses 1.0: 0.x, or a tag with a SemVer pre-release
      # suffix, is marked pre-release; a stable 1.0.0+ tag clears the flag.
      - name: Enforce release notes and pre-release flag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          prerelease=false
          case "$ver" in
            0.*|*-*) prerelease=true ;;
          esac
          echo "version=${ver} prerelease=${prerelease}"
          gh release edit "${GITHUB_REF_NAME}" \
            --notes-file .release-notes.md \
            --prerelease="${prerelease}"

  # Prove each artifact executes on its target OS/arch and honors its argument
  # contract before the release goes public. Each leg downloads its own artifact
  # from the draft and runs _scripts/smoketest.sh against it. No Go toolchain:
  # this runs the released binary, it does not build one.
  #
  # fail-fast: false so one platform's failure doesn't mask another's signal.
  smoketest:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux/amd64
            runs-on: ubuntu-latest
            pattern: cherry-sync_*_linux_amd64
          - name: darwin/arm64
            runs-on: macos-latest
            pattern: cherry-sync_*_darwin_arm64
            signed: true
          - name: darwin/amd64
            runs-on: macos-latest
            pattern: cherry-sync_*_darwin_amd64
            signed: true
            rosetta: true
    name: smoketest ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    # The signature check below is guarded by the same switch that turns signing
    # on in .goreleaser.yaml, so a fork holding none of the Apple secrets skips
    # the check rather than failing a release it deliberately built unsigned.
    # Only the emptiness of the secret crosses into the job, never its value.
    env:
      SIGNING_ENABLED: ${{ secrets.MACOS_SIGN_P12 != '' }}
    steps:
      # Only the _scripts/ checks are needed from the tree.
      - uses: actions/checkout@v6

      # Executing the x86_64 binary on an Apple-silicon runner needs Rosetta 2,
      # which the runner image may or may not ship. softwareupdate is a no-op
      # when it is already present.
      - name: Ensure Rosetta 2
        if: ${{ matrix.rosetta }}
        run: softwareupdate --install-rosetta --agree-to-license

      # The asset is a bare executable named for its target, so rename it to a
      # fixed path the smoketest step can name unconditionally and restore the
      # executable bit: a release asset is an opaque blob, so the file mode does
      # not survive the upload/download round trip.
      - name: Download artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p smoketest-bin
          gh release download "${GITHUB_REF_NAME}" \
            --pattern '${{ matrix.pattern }}' \
            --dir smoketest-bin
          asset="$(find smoketest-bin -type f -print -quit)"
          test -n "$asset" || { echo "no asset matched ${{ matrix.pattern }}" >&2; exit 1; }
          mv "$asset" smoketest-bin/csync
          chmod +x smoketest-bin/csync

      # smoketest.sh cannot see signing: the Go linker ad-hoc signs every arm64
      # Mach-O, so an unsigned build still executes and passes every behavioral
      # check while remaining the binary Gatekeeper blocks (#93). Runs before the
      # smoketest so a signing fault is reported as one. The script's header
      # covers what it asserts and why notarization is not among them.
      - name: Verify macOS signature
        if: ${{ matrix.signed && env.SIGNING_ENABLED == 'true' }}
        run: ./_scripts/verify-macos-signature.sh smoketest-bin/csync

      - name: Smoketest
        run: ./_scripts/smoketest.sh smoketest-bin/csync "${GITHUB_REF_NAME}"

  # GitHub has no native arm64 Linux runner, so this leg stands up an ephemeral
  # Azure arm64 VM, asserts the same contract the matrix legs do on a host we
  # provision, and tears it down. Runs in the `release` Environment for a stable
  # Azure OIDC subject; no client secret is stored. Scripts do the work, so every
  # step is reproducible by hand. See RELEASE-GATE.md.
  smoketest-linux-arm64:
    name: smoketest linux/arm64
    needs: build
    runs-on: ubuntu-latest
    # Must stay below the sweeper's age threshold (azure-smoketest-sweep.sh): a
    # live job's resources then stay younger than it, so a concurrent sweep can
    # never reap them. Also bounds a hung provision from stranding the VM for
    # GitHub's 6h default.
    timeout-minutes: 30
    environment: release
    permissions:
      id-token: write     # mint the OIDC token for azure/login
      contents: write     # gh release download from the draft release
    steps:
      - uses: actions/checkout@v6

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # No chmod on the runner: scp does not carry the mode across, so the
      # VM-side command below sets it.
      - name: Download artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p smoketest-bin
          gh release download "${GITHUB_REF_NAME}" \
            --pattern 'cherry-sync_*_linux_arm64' \
            --dir smoketest-bin
          asset="$(find smoketest-bin -type f -print -quit)"
          test -n "$asset" || { echo "no asset matched cherry-sync_*_linux_arm64" >&2; exit 1; }
          mv "$asset" smoketest-bin/csync

      # Throwaway SSH key, and a VM whose port 22 is open only to this runner's
      # IP. Provisioning is its own step so a failure here fails here, rather
      # than surfacing later as a confusing SSH error.
      - name: Provision the arm64 VM
        id: provision
        run: |
          ssh-keygen -t ed25519 -N '' -f ./id
          AZ_SSH_PUBKEY=./id.pub _scripts/azure-smoketest-vm.sh up

      # Copy the binary + smoketest.sh to the VM and run the smoketest over SSH.
      - name: Smoketest over SSH
        env:
          VM_HOST: ${{ steps.provision.outputs.host }}
          VM_USER: ${{ steps.provision.outputs.user }}
        run: |
          scp -i ./id -o StrictHostKeyChecking=accept-new \
            smoketest-bin/csync _scripts/smoketest.sh "${VM_USER}@${VM_HOST}:."
          ssh -i ./id -o StrictHostKeyChecking=accept-new "${VM_USER}@${VM_HOST}" \
            "chmod +x ./csync && bash ./smoketest.sh ./csync ${GITHUB_REF_NAME}"

      - name: Tear down VM
        if: always()
        run: _scripts/azure-smoketest-vm.sh down

  # Reveal the release only if every gate job passed. On any failure this job
  # does not run and the release stays a draft, invisible, for inspection.
  promote:
    needs: [smoketest, smoketest-linux-arm64]
    runs-on: ubuntu-latest
    steps:
      # No actions/checkout: this job only calls the GitHub API. gh would infer
      # the repo from a git remote that a checkout-less job does not have, so
      # name it explicitly with --repo instead of paying for a checkout.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "All smoketest legs passed; publishing ${GITHUB_REF_NAME}"
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
