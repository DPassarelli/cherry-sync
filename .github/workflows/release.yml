name: release

on:
  push:
    tags:
      - 'v*'

# build creates the GitHub Release and uploads assets (write); the smoketest jobs
# download those assets from the draft (read); promote flips the release live
# (write). contents: write covers all three.
permissions:
  contents: write

jobs:
  # Build every artifact and publish the GitHub Release as a DRAFT — invisible to
  # users (release.draft: true in .goreleaser.yaml). Release notes and the
  # pre-release flag are set here, on the draft. The release is only revealed by
  # the promote job, and only after every smoketest leg passes.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history + tags so GoReleaser can resolve the version.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Pull the section for the tag being released out of CHANGELOG.md and hand
      # it to GoReleaser as the release body — so the GitHub Release notes are
      # the curated Keep a Changelog entry, not an autogenerated git-log dump.
      - name: Extract release notes from CHANGELOG
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## / { flag=0 }
            flag && /^\[/  { flag=0 }
            flag { print }
          ' CHANGELOG.md > .release-notes.md
          echo "----- release notes for ${ver} -----"
          cat .release-notes.md
          test -s .release-notes.md || { echo "no CHANGELOG section for ${ver}"; exit 1; }

      # Creates a DRAFT release with assets attached (release.draft: true).
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --release-notes=.release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GoReleaser already passes --release-notes when it creates the release, but
      # the v0.1.0 run published with the commit message as the body instead of
      # this file's contents — a discrepancy the run logs don't explain. Rather
      # than depend on goreleaser's body-setting being the final word, re-assert
      # the body from the same .release-notes.md. Same source of truth,
      # deterministic outcome, and the diff is visible in this step's log if the
      # two ever disagree again. This operates on the DRAFT — it does not reveal
      # the release; promote does that after smoketest passes.
      #
      # The same step pins the pre-release flag: anything in the 0.x series, or a
      # tag carrying a SemVer pre-release suffix (e.g. -rc1), is marked
      # pre-release; a stable 1.0.0+ tag clears the flag. Keyed off the version so
      # it needs no attention when the project crosses 1.0.
      - name: Enforce release notes and pre-release flag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          prerelease=false
          case "$ver" in
            0.*|*-*) prerelease=true ;;
          esac
          echo "version=${ver} prerelease=${prerelease}"
          gh release edit "${GITHUB_REF_NAME}" \
            --notes-file .release-notes.md \
            --prerelease="${prerelease}"

  # Tier 1 (Phase 1) pre-publish smoketest: prove each native-runner artifact
  # actually executes on its target OS/arch and honors its no-argument contract
  # before the release goes public. Each leg downloads its own artifact from the
  # draft release and runs _scripts/smoketest.sh against it. No Go toolchain — the
  # smoketest runs the released binary, it does not build one.
  #
  # fail-fast: false so one platform's failure doesn't mask another's signal.
  # Phase 2 adds darwin/amd64 (run via Rosetta on the Apple-silicon runner). The
  # remaining linux/arm64 leg needs an ephemeral Azure arm64 VM and lands once
  # that infrastructure exists.
  smoketest:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux/amd64
            runs-on: ubuntu-latest
            pattern: cherry-sync_*_linux_amd64.tar.gz
          - name: darwin/arm64
            runs-on: macos-latest
            pattern: cherry-sync_*_darwin_arm64.tar.gz
          - name: darwin/amd64
            runs-on: macos-latest
            pattern: cherry-sync_*_darwin_amd64.tar.gz
            rosetta: true
    name: smoketest ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    steps:
      # Only _scripts/smoketest.sh is needed from the tree.
      - uses: actions/checkout@v6

      # darwin/amd64 runs on an Apple-silicon runner, so executing the x86_64
      # binary needs Rosetta 2 (macOS invokes it transparently on exec once it's
      # installed). The runner image may or may not ship it, so ensure it here;
      # softwareupdate is a no-op when Rosetta is already present.
      - name: Ensure Rosetta 2
        if: ${{ matrix.rosetta }}
        run: softwareupdate --install-rosetta --agree-to-license

      # Download this leg's artifact from the DRAFT release by tag and unpack the
      # csync binary. gh is preinstalled on GitHub-hosted runners.
      - name: Download and unpack artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p smoketest-bin
          gh release download "${GITHUB_REF_NAME}" \
            --pattern '${{ matrix.pattern }}' \
            --dir smoketest-bin
          archive="$(find smoketest-bin -name '*.tar.gz' -print -quit)"
          tar -xzf "$archive" -C smoketest-bin

      - name: Smoketest
        run: ./_scripts/smoketest.sh smoketest-bin/csync

  # Reveal the release only if every smoketest leg passed. `needs: smoketest` gates this
  # on the whole matrix succeeding; on any failure the release stays a draft
  # (invisible) for inspection and this job does not run.
  promote:
    needs: smoketest
    runs-on: ubuntu-latest
    steps:
      # No actions/checkout here: this job only calls the GitHub API. gh infers
      # the target repo from the local git remote, which a checkout-less job
      # doesn't have ("fatal: not a git repository"), so name it explicitly with
      # --repo "$GITHUB_REPOSITORY" instead of paying for a checkout.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "All smoke test legs passed; publishing ${GITHUB_REF_NAME}"
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
