name: release

on:
  push:
    tags:
      - 'v*'

# GoReleaser needs to create the GitHub Release and upload assets.
permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history + tags so GoReleaser can resolve the version.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Pull the section for the tag being released out of CHANGELOG.md and hand
      # it to GoReleaser as the release body — so the GitHub Release notes are
      # the curated Keep a Changelog entry, not an autogenerated git-log dump.
      - name: Extract release notes from CHANGELOG
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## / { flag=0 }
            flag && /^\[/  { flag=0 }
            flag { print }
          ' CHANGELOG.md > .release-notes.md
          echo "----- release notes for ${ver} -----"
          cat .release-notes.md
          test -s .release-notes.md || { echo "no CHANGELOG section for ${ver}"; exit 1; }

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --release-notes=.release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
