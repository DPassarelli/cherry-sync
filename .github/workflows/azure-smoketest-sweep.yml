name: azure-smoketest-sweep

# Independent backstop for the linux/arm64 smoketest leg: reclaim any ephemeral
# Azure resource the inline teardown missed (a cancelled or crashed release
# run). The release pipeline does not depend on this; it only bounds cost when a
# teardown is skipped.
on:
  schedule:
    - cron: '27 3,15 * * *'   # twice daily, 03:27 & 15:27 UTC (off the top of the hour, which GitHub schedules less reliably)
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'List orphans without deleting'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write         # azure/login via OIDC

jobs:
  # Deliberately NOT tied to a GitHub Environment: referencing `environment:`
  # opens a Deployment record on every run, which a scheduled job would inflate
  # (#78). This job authenticates instead with a federated credential scoped to
  # the branch subject, which is also why the AZURE_* identifiers are repo-level
  # rather than environment secrets. See RELEASE-GATE.md.
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # bound a hung `az delete`; nothing here is time-critical
    steps:
      - uses: actions/checkout@v6

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sweep orphaned ephemeral resources
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          args=()
          if [ "${DRY_RUN}" = "true" ]; then args+=(--dry-run); fi
          _scripts/azure-smoketest-sweep.sh "${args[@]}"
