name: azure-smoketest-sweep

# Independent backstop for the linux/arm64 smoketest leg: reclaim any ephemeral
# Azure resource the inline teardown missed (a cancelled or crashed release
# run). Runs once a day, and on demand for manual checks — so a resource the
# inline teardown missed lives at most about a day (plus the sweeper's age
# threshold) before this reclaims it. The release pipeline does NOT depend on
# this; it only bounds cost/leakage when a teardown is skipped, and orphans only
# arise when a release run dies mid-provision, which is rare.
on:
  schedule:
    - cron: '27 3 * * *'   # daily, 03:27 UTC (off the top of the hour, which GitHub schedules less reliably)
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'List orphans without deleting'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write         # azure/login via OIDC

jobs:
  # Deliberately NOT tied to a GitHub Environment. A job that references an
  # `environment:` opens a Deployment record on every run, so a scheduled
  # maintenance job would steadily inflate the repo's deployment count with
  # noise (see issue #78). Instead this job authenticates to Azure with a
  # federated credential scoped to the branch subject
  # (repo:DPassarelli/cherry-sync:ref:refs/heads/main) — scheduled runs execute
  # on the default branch — so no Environment, and thus no Deployment, is
  # involved. The AZURE_* identifiers are repo-level secrets for the same reason
  # (environment secrets would require re-entering the Environment). The release
  # workflow keeps `environment: release`: its runs are genuine, infrequent
  # deployments, unlike this scheduled backstop.
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sweep orphaned ephemeral resources
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          args=()
          if [ "${DRY_RUN}" = "true" ]; then args+=(--dry-run); fi
          _scripts/azure-smoketest-sweep.sh "${args[@]}"
