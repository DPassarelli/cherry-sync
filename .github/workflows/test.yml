name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      # Run every leg to completion; one platform failing must not mask the
      # result of the others — the whole point of the matrix is per-leg signal.
      fail-fast: false
      matrix:
        # OS/arch and rsync implementation are independent axes, but can't be
        # combined freely. csync needs rsync's --itemize-changes / --files-from
        # / --from0; the portable openrsync on Linux (protocol 27) implements
        # none of them and there's no itemize-capable openrsync packaged for
        # Linux, so openrsync coverage comes only from macOS — Apple's openrsync
        # does support those flags and is the real-world target. GitHub does not
        # offer an ARM64 Linux runner, so arm64 coverage rides on the macOS
        # runners (which are arm64). The `rsync` field is what each leg CLAIMS to
        # run; "any" means discover-and-report without asserting (macOS 15 may
        # still ship GNU rsync — Apple switched to openrsync mid-cycle).
        include:
          - name: linux-x64-gnu
            runs-on: ubuntu-latest
            rsync: gnu
          - name: macos15-arm64
            runs-on: macos-15
            rsync: any
          - name: macos26-arm64-openrsync
            runs-on: macos-26
            rsync: openrsync
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Force macOS to test Apple's system rsync, not the Homebrew GNU rsync the
      # runner images ship ahead of it on PATH. /usr/bin/rsync is openrsync on
      # recent macOS — the implementation csync's users actually run — and Linux
      # already covers GNU. Without this shim both macOS legs would silently test
      # GNU and the openrsync coverage would vanish.
      - name: Prefer Apple's system rsync (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$HOME/rsync-shim"
          ln -sf /usr/bin/rsync "$HOME/rsync-shim/rsync"
          echo "$HOME/rsync-shim" >> "$GITHUB_PATH"

      # Record which rsync this leg actually resolves to, so the log always shows
      # what was really exercised.
      - name: Show rsync identity
        run: |
          command -v rsync
          rsync --version

      # Fail loudly if a leg is not running the rsync it claims to — a swapped
      # runner image (or a broken shim) would otherwise silently drop an
      # implementation from coverage while the suite stays green. openrsync
      # self-identifies as "openrsync: protocol version N"; GNU prints
      # "rsync  version 3.x" (both verified by experiment). A leg with rsync:any
      # only reports what it found and does not assert.
      - name: Confirm rsync implementation
        run: |
          if rsync --version | grep -qi openrsync; then
            actual=openrsync
          else
            actual=gnu
          fi
          echo "expected=${{ matrix.rsync }} actual=$actual"
          if [ "${{ matrix.rsync }}" = "any" ]; then
            echo "discover mode: not asserting a specific implementation"
          else
            [ "$actual" = "${{ matrix.rsync }}" ]
          fi

      - name: go vet
        run: go vet ./...

      # The test runner. Pinned, not @latest, so a CI run is reproducible.
      # GOPATH/bin isn't guaranteed on PATH across all runner images, so add it
      # explicitly (scripts/test-report.sh resolves it the same way for local use).
      - name: Install gotestsum
        run: |
          go install gotest.tools/gotestsum@v1.13.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Run the suite and publish the dashboard panel. scripts/test-report.sh is
      # the same script you can run locally, so the job-summary panel and the
      # local preview can't drift. It streams gotestsum's live output to this log
      # and writes the panel (environment, Gherkin-vs-unit breakdown, failures,
      # per-package detail) to $GITHUB_STEP_SUMMARY. REPORT_LABEL names the panel
      # for this matrix leg; rsync/Go/runner identity is gathered by the script.
      # It exits with gotestsum's status, so a red run still publishes its panel
      # and then fails this step (and thus the job and ci-gate).
      - name: Run tests & publish report
        env:
          REPORT_LABEL: ${{ matrix.name }}
        run: ./scripts/test-report.sh

  # Static security analysis. Kept out of the matrix: gosec analyzes source and
  # is platform-independent, so it runs once rather than per-leg (unlike go vet,
  # which is per-GOOS and stays in the matrix). Pinned to the same version and
  # invocation as the lefthook pre-push hook (lefthook.yml) so the local gate and
  # CI can't drift — CI is the authoritative backstop for when the local hook
  # isn't installed or gets bypassed.
  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.26.1 -quiet ./...

  # Formatting gate — the gofmt rule from CLAUDE.md. Like gosec it's
  # platform-independent and runs once, and is the CI backstop for a local check
  # that nothing currently enforces. `gofmt -l` lists files that aren't
  # formatted; a non-empty list is the failure, and it's printed so the log names
  # the offending files.
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

  # Single stable status check to require in branch protection. The matrix leg
  # names can change freely underneath this gate without breaking the required
  # check. `needs.*.result` aggregates the gating jobs — "success" only if the
  # whole test matrix, gosec, and gofmt all passed. `if: always()` makes the gate
  # run even when a dependency fails (a skipped required check would itself block
  # the merge).
  ci-gate:
    name: ci-gate
    needs: [test, gosec, gofmt]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all gating jobs to have succeeded
        run: |
          echo "test=${{ needs.test.result }} gosec=${{ needs.gosec.result }} gofmt=${{ needs.gofmt.result }}"
          [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.gosec.result }}" = "success" ] && [ "${{ needs.gofmt.result }}" = "success" ]
